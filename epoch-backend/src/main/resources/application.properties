# =========================================================================
# EPOCH 2.0 HISTORICAL KNOWLEDGE ENGINE - SPRING BOOT CONFIGURATION
# =========================================================================

spring.application.name=epoch-backend
server.port=${SERVER_PORT:8080}

# MySQL Database DataSource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:epoch_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:epoch_app}
spring.datasource.password=${DB_PASSWORD:EpochApp@2026Secure!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Engine
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Jackson JSON Formatting
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.fail-on-empty-beans=false
